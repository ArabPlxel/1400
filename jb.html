<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:13px/1.4 monospace; }
  #diag { position:fixed; top:0; left:0; right:0; padding:8px;
          background:#a00; color:#fff; z-index:99999; text-align:center; }
  #diag.ok { background:#080; }
  #wrap { padding:60px 12px 12px 12px; }
  #out { white-space:pre-wrap; font-size:11px; color:#8f8;
         max-height:80vh; overflow:auto; }
  #brand { padding:8px; background:#0e1116; border-bottom:1px solid #1e2732;
           position:fixed; top:30px; left:0; right:0; text-align:center;
           font-weight:700; letter-spacing:0.14em; color:#e6ebf2; z-index:9998; }
</style>
</head>
<body>
<div id="diag">HTML LOADED - waiting for jb.js</div>
<div id="brand">RAW GAME</div>
<div id="wrap"><div id="out"></div></div>

<script>
window.__lines = [];
window.diag = function(msg, cls) {
    var el = document.getElementById('diag');
    if (el) { el.textContent = msg; el.className = cls || ''; }
    window.__lines.push(msg);
    var out = document.getElementById('out');
    if (out) out.textContent = window.__lines.join('\n');
};
window.addEventListener('error', function(e) {
    window.diag('JS ERROR: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
    var r = e.reason;
    window.diag('PROMISE REJECT: ' + (r && r.message ? r.message : r));
});
</script>

<script type="module" src="jb.js?v=21"></script>
</body>
</html>
